{% extends 'index.html' %}
{% load crispy_forms_tags %}

{% block content %}
  <div class=" d-flex justify-content-center align-items-center px-3 py-5 mt-5">
    <div class="card shadow-sm w-100" style="max-width: 600px;">
      <div class="card-body p-4 form-font">
        <h2 class="mb-4 text-center">Claim Today with IDFinder<sup style="font-size: 0.3em; top: -1.9em; position: relative;">KE</sup></h2>
        <form method="post" enctype="multipart/form-data" class="text-dark">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary mt-3 w-100">Submit Claim</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
